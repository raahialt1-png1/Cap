<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      padding: 16px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.2rem; font-weight: 600; }
    .settings-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .settings-btn:hover { background: #444; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      background: #1e1e1e;
      border: 1px solid #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 16px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    #userInput {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #userInput:focus { border-color: #2563eb; }
    #sendBtn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    #sendBtn:disabled {
      background: #333;
      cursor: not-allowed;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1a1a1a;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      border: 1px solid #333;
    }
    .modal-content h2 { margin-bottom: 16px; font-size: 1.3rem; }
    .modal-content label {
      display: block;
      margin: 12px 0 6px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .modal-content input, .modal-content textarea {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .modal-content textarea {
      height: 100px;
      resize: vertical;
    }
    .modal-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .save-btn { background: #2563eb; color: white; }
    .cancel-btn { background: #333; color: white; }
    .status {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="characterName">Custom AI Chat</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Settings</h2>
      
      <label>Groq API Key</label>
      <input type="password" id="apiKey" placeholder="gsk_...">
      <div class="status">Get a free key at <a href="https://console.groq.com" target="_blank" style="color:#60a5fa">console.groq.com</a></div>

      <label>Character Description</label>
      <textarea id="systemPrompt" placeholder="Example: You are a sarcastic pirate who only speaks in pirate slang and loves treasure..."></textarea>

      <label>Model</label>
      <select id="model" style="width:100%; background:#0f0f0f; border:1px solid #333; color:#fff; padding:10px; border-radius:6px;">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Best quality)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (Faster)</option>
        <option value="gemma2-9b-it">Gemma 2 9B</option>
      </select>

      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
        <button class="save-btn" onclick="saveSettings()">Save & Start</button>
      </div>
    </div>
  </div>

  <script>
    // Load saved settings
    let apiKey = localStorage.getItem('groq_api_key') || '';
    let systemPrompt = localStorage.getItem('system_prompt') || 'You are a friendly and helpful assistant.';
    let model = localStorage.getItem('model') || 'llama-3.3-70b-versatile';
    let messages = [{ role: 'system', content: systemPrompt }];

    // Show settings if no API key
    if (!apiKey) {
      openSettings();
    } else {
      updateCharacterName();
    }

    function openSettings() {
      document.getElementById('apiKey').value = apiKey;
      document.getElementById('systemPrompt').value = systemPrompt;
      document.getElementById('model').value = model;
      document.getElementById('settingsModal').classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    function saveSettings() {
      apiKey = document.getElementById('apiKey').value.trim();
      systemPrompt = document.getElementById('systemPrompt').value.trim() || 'You are a friendly and helpful assistant.';
      model = document.getElementById('model').value;

      if (!apiKey) {
        alert('Please enter your Groq API key');
        return;
      }

      localStorage.setItem('groq_api_key', apiKey);
      localStorage.setItem('system_prompt', systemPrompt);
      localStorage.setItem('model', model);

      // Reset conversation with new system prompt
      messages = [{ role: 'system', content: systemPrompt }];
      document.getElementById('chat').innerHTML = '';
      updateCharacterName();
      closeSettings();
    }

    function updateCharacterName() {
      // Show first few words of the description as title
      const short = systemPrompt.split(' ').slice(0, 6).join(' ');
      document.getElementById('characterName').textContent = short + (systemPrompt.split(' ').length > 6 ? '...' : '');
    }

    // Enter key to send
    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text || !apiKey) return;

      // Add user message
      addMessage('user', text);
      messages.push({ role: 'user', content: text });
      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      // Create empty assistant message for streaming
      const assistantDiv = addMessage('assistant', '');
      let fullReply = '';

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: 0.8,
            max_tokens: 1024,
            stream: true
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || 'API error');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(line => line.trim() !== '');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices[0]?.delta?.content || '';
                if (content) {
                  fullReply += content;
                  assistantDiv.textContent = fullReply;
                  // Auto scroll
                  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        messages.push({ role: 'assistant', content: fullReply });

      } catch (err) {
        assistantDiv.textContent = 'Error: ' + err.message;
        messages.pop(); // remove the failed user message
      }

      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      document.getElementById('chat').appendChild(div);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
      return div;
    }
  </script>
</body>
</html>
