<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      padding: 14px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #555;
      background: #222;
    }
    .header h1 { font-size: 1.15rem; font-weight: 600; }
    .settings-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .message-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }
    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.assistant {
      align-self: flex-start;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #444;
      background: #222;
    }
    .message {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user .message {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .assistant .message {
      background: #1e1e1e;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 16px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    #userInput {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #userInput:focus { border-color: #2563eb; }
    #sendBtn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    #sendBtn:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1a1a1a;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      border: 1px solid #333;
    }
    .modal-content h2 { margin-bottom: 16px; }
    .modal-content label {
      display: block;
      margin: 14px 0 6px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .modal-content input,
    .modal-content textarea,
    .modal-content select {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .modal-content textarea { height: 100px; resize: vertical; }
    .modal-actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .save-btn { background: #2563eb; color: white; }
    .cancel-btn { background: #333; color: white; }
    .status { font-size: 0.8rem; color: #888; margin-top: 6px; }
    .error-box {
      background: #3f1f1f;
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="avatar.jpg" class="header-avatar" alt="AI" id="headerAvatar">
      <h1 id="characterName">Custom AI Chat</h1>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Settings</h2>
      
      <label>Groq API Key</label>
      <input type="password" id="apiKey" placeholder="gsk_...">
      <div class="status">Get free key → <a href="https://console.groq.com/keys" target="_blank" style="color:#60a5fa">console.groq.com/keys</a></div>

      <label>Character Description</label>
      <textarea id="systemPrompt" placeholder="Describe the personality..."></textarea>

      <label>Model (current working ones)</label>
      <select id="model">
        <option value="openai/gpt-oss-20b">GPT-OSS 20B (recommended)</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
        <option value="qwen/qwen3.6-27b">Qwen3.6 27B</option>
        <option value="groq/compound-mini">Groq Compound Mini</option>
      </select>

      <div id="errorBox" class="error-box"></div>

      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
        <button class="save-btn" onclick="saveSettings()">Save & Start</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('groq_api_key') || '';
    let systemPrompt = localStorage.getItem('system_prompt') || 'You are a soft-spoken, artistic woman. Speak gently and warmly.';
    let model = localStorage.getItem('model') || 'openai/gpt-oss-20b';
    let messages = [{ role: 'system', content: systemPrompt }];

    // Check if avatar exists
    const testImg = new Image();
    testImg.onerror = () => {
      document.getElementById('headerAvatar').style.display = 'none';
    };
    testImg.src = 'avatar.jpg';

    if (!apiKey) openSettings();
    else updateCharacterName();

    function openSettings() {
      document.getElementById('apiKey').value = apiKey;
      document.getElementById('systemPrompt').value = systemPrompt;
      document.getElementById('model').value = model;
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('settingsModal').classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    function saveSettings() {
      apiKey = document.getElementById('apiKey').value.trim();
      systemPrompt = document.getElementById('systemPrompt').value.trim() || 'You are a friendly assistant.';
      model = document.getElementById('model').value;

      if (!apiKey) {
        showError('Please enter your Groq API key');
        return;
      }

      localStorage.setItem('groq_api_key', apiKey);
      localStorage.setItem('system_prompt', systemPrompt);
      localStorage.setItem('model', model);

      messages = [{ role: 'system', content: systemPrompt }];
      document.getElementById('chat').innerHTML = '';
      updateCharacterName();
      closeSettings();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function updateCharacterName() {
      const words = systemPrompt.split(' ');
      document.getElementById('characterName').textContent = 
        words.slice(0, 6).join(' ') + (words.length > 6 ? '...' : '');
    }

    document.getElementById('userInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text || !apiKey) return;

      addMessage('user', text);
      messages.push({ role: 'user', content: text });
      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      const bubble = addMessage('assistant', 'Thinking...');

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: 0.85,
            max_tokens: 1024,
            stream: false   // non-streaming = more reliable
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API Error ' + response.status);
        }

        const reply = data.choices[0].message.content;
        bubble.textContent = reply;
        messages.push({ role: 'assistant', content: reply });

      } catch (err) {
        bubble.textContent = 'Error: ' + err.message;
        console.error(err);
        messages.pop();
      }

      document.getElementById('sendBtn').disabled = false;
      input.focus();
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      if (role === 'assistant') {
        const img = document.createElement('img');
        img.src = 'avatar.jpg';
        img.className = 'avatar';
        img.onerror = function() { this.style.display = 'none'; };
        row.appendChild(img);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message';
      bubble.textContent = text;
      row.appendChild(bubble);

      document.getElementById('chat').appendChild(row);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>
