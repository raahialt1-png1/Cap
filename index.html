<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .msg {
      margin-bottom: 15px;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      margin-left: auto;
    }
    .bot {
      background: #222;
      border: 1px solid #333;
    }
    .input-area {
      padding: 15px;
      background: #1a1a1a;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }
    #input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled {
      background: #444;
    }
    .settings {
      background: #333;
    }
  </style>
</head>
<body>

  <div class="header">
    <div><strong>Custom AI Chat</strong></div>
    <button class="settings" onclick="openSettings()">Settings</button>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    // ========== SETTINGS ==========
    let apiKey = localStorage.getItem("apiKey") || "";
    let systemPrompt = localStorage.getItem("systemPrompt") || "You are a friendly, soft-spoken woman. Speak gently.";
    let model = localStorage.getItem("model") || "openai/gpt-oss-20b";
    let messages = [{ role: "system", content: systemPrompt }];

    // ========== OPEN SETTINGS ==========
    function openSettings() {
      const key = prompt("Enter your Groq API Key (gsk_...):", apiKey);
      if (key === null) return;

      const promptText = prompt("Character description:", systemPrompt);
      if (promptText === null) return;

      apiKey = key.trim();
      systemPrompt = promptText.trim() || "You are a helpful assistant.";
      
      localStorage.setItem("apiKey", apiKey);
      localStorage.setItem("systemPrompt", systemPrompt);

      messages = [{ role: "system", content: systemPrompt }];
      document.getElementById("chat").innerHTML = "";
      alert("Settings saved! You can start chatting.");
    }

    // ========== SEND MESSAGE ==========
    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert("Please set your API key first (click Settings)");
        openSettings();
        return;
      }

      // Show user message
      addMessage("user", text);
      messages.push({ role: "user", content: text });
      input.value = "";
      document.getElementById("sendBtn").disabled = true;

      const botMsg = addMessage("bot", "Thinking...");

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: 0.8,
            max_tokens: 800
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "API error");
        }

        const reply = data.choices[0].message.content;
        botMsg.textContent = reply;
        messages.push({ role: "assistant", content: reply });

      } catch (err) {
        botMsg.textContent = "Error: " + err.message;
        console.error(err);
      }

      document.getElementById("sendBtn").disabled = false;
      input.focus();
    }

    function addMessage(type, text) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
      return div;
    }

    // Enter key support
    document.getElementById("input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    // Auto open settings if no key
    if (!apiKey) {
      setTimeout(openSettings, 500);
    }
  </script>
</body>
</html>
