<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      padding: 14px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #444;
    }
    .header h1 { font-size: 1.15rem; font-weight: 600; }
    .settings-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .settings-btn:hover { background: #444; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .message-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }
    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.assistant {
      align-self: flex-start;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #444;
    }
    .message {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user .message {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .assistant .message {
      background: #1e1e1e;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 16px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    #userInput {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #userInput:focus { border-color: #2563eb; }
    #sendBtn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    #sendBtn:disabled {
      background: #333;
      cursor: not-allowed;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1a1a1a;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      border: 1px solid #333;
    }
    .modal-content h2 { margin-bottom: 16px; font-size: 1.3rem; }
    .modal-content label {
      display: block;
      margin: 14px 0 6px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .modal-content input, .modal-content textarea, .modal-content select {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .modal-content textarea {
      height: 100px;
      resize: vertical;
    }
    .modal-actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .save-btn { background: #2563eb; color: white; }
    .cancel-btn { background: #333; color: white; }
    .status {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
    }
    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="avatar.jpg" class="header-avatar" alt="AI" onerror="this.style.display='none'">
      <h1 id="characterName">Custom AI Chat</h1>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Settings</h2>
